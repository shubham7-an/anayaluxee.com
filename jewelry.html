<script>

/* ============================================================
   ANAYALUXEE - AUTOMATIC JEWELRY PRODUCT SYSTEM
   ============================================================

   PRODUCT ADD KARNE KA RULE:

   products/jewelry/

   Example:

   Gold_Necklace_1.jpg
   Gold_Necklace_2.jpg
   Gold_Necklace_3.mp4

   Website automatically:

   GOLD NECKLACE

   ko ONE product banayegi.

   New product ke liye sirf GitHub folder mein files upload karo.
   CODE CHANGE KARNE KI ZARURAT NAHI HAI.

   ============================================================ */


/* ============================================================
   GITHUB SETTINGS
   ============================================================ */

const GITHUB_FOLDER_API =
    "https://api.github.com/repos/shubham7-an/anayaluxee.com/contents/products/jewelry?ref=main";

const GITHUB_RAW_ROOT =
    "https://raw.githubusercontent.com/shubham7-an/anayaluxee.com/main/products/jewelry/";


/* ============================================================
   SUPPORTED MEDIA
   ============================================================ */

const mediaExtensions = [
    "jpg",
    "jpeg",
    "png",
    "webp",
    "mp4",
    "webm"
];


/* ============================================================
   CURRENT PRODUCT / MODAL DATA
   ============================================================ */

let currentMedia = [];
let currentIndex = 0;


/* ============================================================
   GET MEDIA TYPE
   ============================================================ */

function getMediaType(filename){

    const extension =
        filename
            .split(".")
            .pop()
            .toLowerCase();

    if(
        extension === "mp4" ||
        extension === "webm"
    ){

        return "video";

    }

    return "image";

}


/* ============================================================
   GET FILE EXTENSION
   ============================================================ */

function getFileExtension(filename){

    return filename
        .split(".")
        .pop()
        .toLowerCase();

}


/* ============================================================
   GET PRODUCT BASE NAME
   ============================================================

   Gold_Necklace_1.jpg
   Gold_Necklace_2.jpg
   Gold_Necklace_3.mp4

   becomes:

   Gold_Necklace

   Also:

   Pearl_Bracelet.jpg

   becomes:

   Pearl_Bracelet

   ============================================================ */

function getProductBase(filename){

    const withoutExtension =
        filename.replace(
            /\.[^/.]+$/,
            ""
        );


    /*
       Only remove the FINAL _number.

       Example:

       Gold_Necklace_1
       Gold_Necklace_2

       -> Gold_Necklace
    */

    return withoutExtension
        .replace(/_\d+$/,"");

}


/* ============================================================
   PRODUCT NAME
   ============================================================

   Gold_Necklace
   ->
   Gold Necklace

   designer_necklace
   ->
   Designer Necklace

   ============================================================ */

function createProductName(base){

    return base
        .replace(/_/g," ")
        .replace(/\s+/g," ")
        .trim()
        .replace(/\b\w/g,letter =>
            letter.toUpperCase()
        );

}


/* ============================================================
   FILE NUMBER
   ============================================================

   Product.jpg       -> 0
   Product_1.jpg     -> 1
   Product_2.jpg     -> 2
   Product_10.jpg    -> 10

   ============================================================ */

function getMediaNumber(filename){

    const withoutExtension =
        filename.replace(
            /\.[^/.]+$/,
            ""
        );


    const match =
        withoutExtension.match(
            /_(\d+)$/
        );


    if(match){

        return Number(
            match[1]
        );

    }


    return 0;

}


/* ============================================================
   GET ALL FILES FROM GITHUB
   ============================================================ */

async function getAllJewelryFiles(){

    const cacheBust =
        Date.now();


    const response =
        await fetch(
            GITHUB_FOLDER_API +
            "&cacheBust=" +
            cacheBust,
            {
                method:"GET",

                headers:{
                    "Accept":
                    "application/vnd.github+json"
                },

                cache:"no-store"
            }
        );


    if(!response.ok){

        throw new Error(
            "GitHub API Error: " +
            response.status
        );

    }


    const data =
        await response.json();


    if(!Array.isArray(data)){

        throw new Error(
            "Invalid GitHub folder response."
        );

    }


    return data

        .filter(item => {

            return (
                item.type === "file" &&
                mediaExtensions.includes(
                    getFileExtension(
                        item.name
                    )
                )
            );

        })

        .map(item => ({

            name:
                item.name,

            src:
                GITHUB_RAW_ROOT +
                encodeURIComponent(
                    item.name
                ),

            type:
                getMediaType(
                    item.name
                )

        }));

}


/* ============================================================
   CREATE PRODUCTS AUTOMATICALLY
   ============================================================ */

function createAutomaticProducts(allFiles){

    const productMap =
        new Map();


    /*
       GROUP FILES BY PRODUCT NAME
    */

    allFiles.forEach(file => {

        const base =
            getProductBase(
                file.name
            );


        if(!productMap.has(base)){

            productMap.set(
                base,
                []
            );

        }


        productMap
            .get(base)
            .push(file);

    });


    const products = [];


    /*
       CREATE PRODUCT OBJECT
    */

    productMap.forEach(
        (media,base) => {


            /*
               Sort media:

               Product.jpg
               Product_1.jpg
               Product_2.jpg
               Product_3.mp4
            */

            media.sort(
                (a,b) => {

                    return (
                        getMediaNumber(
                            a.name
                        ) -
                        getMediaNumber(
                            b.name
                        )
                    );

                }
            );


            products.push({

                base:base,

                name:
                    createProductName(
                        base
                    ),

                media:media

            });

        }
    );


    /*
       SORT PRODUCTS ALPHABETICALLY
    */

    products.sort(
        (a,b) =>
            a.name.localeCompare(
                b.name
            )
    );


    return products;

}


/* ============================================================
   LOAD PRODUCTS
   ============================================================ */

async function loadProducts(){

    const grid =
        document.getElementById(
            "productsGrid"
        );


    /*
       LOADING
    */

    grid.innerHTML = `

        <div class="loading">

            <i class="fa-regular fa-gem"></i>

            <p>
                CURATING YOUR COLLECTION...
            </p>

        </div>

    `;


    try{

        /*
           GET ALL GITHUB FILES
        */

        const allFiles =
            await getAllJewelryFiles();


        console.log(
            "ANAYALUXEE FILES:",
            allFiles
        );


        /*
           AUTOMATICALLY CREATE PRODUCTS
        */

        const products =
            createAutomaticProducts(
                allFiles
            );


        console.log(
            "ANAYALUXEE PRODUCTS:",
            products
        );


        /*
           UPDATE PRODUCT COUNT
        */

        const countElement =
            document.querySelector(
                ".catalog-top span"
            );


        if(countElement){

            countElement.textContent =
                `${products.length} PIECES · ANAYALUXEE`;

        }


        /*
           CLEAR LOADING
        */

        grid.innerHTML = "";


        /*
           NO PRODUCTS
        */

        if(!products.length){

            grid.innerHTML = `

                <div class="loading">

                    <i class="fa-regular fa-circle-xmark"></i>

                    <p>
                        NO JEWELRY FOUND
                    </p>

                </div>

            `;

            return;

        }


        /*
           CREATE EVERY PRODUCT CARD
        */

        products.forEach(
            (product,index) => {


                const media =
                    product.media;


                const first =
                    media[0];


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "product-card";


                /* =================================================
                   FIRST MEDIA
                   ================================================= */

                let mediaHTML = "";


                if(
                    first.type === "video"
                ){

                    mediaHTML = `

                        <video

                            src="${first.src}"

                            muted

                            autoplay

                            loop

                            playsinline

                            preload="metadata"

                        ></video>


                        <div class="video-badge">

                            <i
                                class="fa-solid fa-play"
                            ></i>

                        </div>

                    `;

                }

                else{

                    mediaHTML = `

                        <img

                            src="${first.src}"

                            alt="${product.name}"

                            loading="lazy"

                        >

                    `;

                }


                /* =================================================
                   MEDIA COUNT
                   ================================================= */

                const countHTML =
                    media.length > 1

                    ? `

                        <div class="media-count">

                            ${media.length} MEDIA

                        </div>

                      `

                    : "";


                /* =================================================
                   PRODUCT CARD HTML
                   ================================================= */

                card.innerHTML = `

                    <div class="product-media">

                        ${mediaHTML}

                        ${countHTML}

                    </div>


                    <div class="product-info">


                        <span
                            class="product-number"
                        >

                            JEWELRY
                            ${String(index + 1)
                                .padStart(2,"0")}

                        </span>


                        <h3
                            class="product-name"
                        >

                            ${product.name}

                        </h3>


                        <span
                            class="product-action"
                        >

                            VIEW PIECE

                            <i
                                class="fa-solid
                                fa-arrow-right"
                            ></i>

                        </span>


                    </div>

                `;


                /* =================================================
                   OPEN PRODUCT
                   ================================================= */

                card.addEventListener(
                    "click",
                    () => {

                        openProduct(
                            product,
                            media,
                            index
                        );

                    }
                );


                /*
                   ADD CARD TO GRID
                */

                grid.appendChild(
                    card
                );

            }
        );


        console.log(
            "ANAYALUXEE:",
            products.length,
            "PRODUCTS LOADED"
        );

    }


    catch(error){

        console.error(
            "Jewelry catalog error:",
            error
        );


        grid.innerHTML = `

            <div class="loading">

                <i
                    class="fa-regular
                    fa-circle-xmark"
                ></i>


                <p>
                    CATALOG COULD NOT BE LOADED
                </p>


                <small>

                    Please refresh after
                    GitHub Pages deployment.

                </small>

            </div>

        `;

    }

}


/* ============================================================
   OPEN PRODUCT MODAL
   ============================================================ */

function openProduct(
    product,
    media,
    index
){

    currentMedia =
        media;

    currentIndex =
        0;


    /*
       PRODUCT NUMBER
    */

    document
        .getElementById(
            "modalNumber"
        )
        .textContent =
        `JEWELRY ${String(index + 1)
            .padStart(2,"0")}`;


    /*
       PRODUCT NAME
    */

    document
        .getElementById(
            "modalTitle"
        )
        .textContent =
        product.name;


    /*
       INSTAGRAM
    */

    document
        .getElementById(
            "instagramOrder"
        )
        .href =
        "https://www.instagram.com/anayaluxee/";


    /*
       SHOW MEDIA
    */

    renderMainMedia();

    renderThumbnails();


    /*
       OPEN MODAL
    */

    document
        .getElementById(
            "productModal"
        )
        .classList.add(
            "active"
        );


    /*
       STOP PAGE SCROLL
    */

    document.body.style.overflow =
        "hidden";

}


/* ============================================================
   CLOSE PRODUCT MODAL
   ============================================================ */

function closeModal(){

    document
        .getElementById(
            "productModal"
        )
        .classList.remove(
            "active"
        );


    document.body.style.overflow =
        "";


    /*
       STOP VIDEO
    */

    const video =
        document.querySelector(
            "#mainMedia video"
        );


    if(video){

        video.pause();

    }

}


/* ============================================================
   RENDER MAIN MEDIA
   ============================================================ */

function renderMainMedia(){

    const container =
        document.getElementById(
            "mainMedia"
        );


    if(!currentMedia.length){

        return;

    }


    const item =
        currentMedia[
            currentIndex
        ];


    let html = "";


    /*
       VIDEO
    */

    if(
        item.type === "video"
    ){

        html = `

            <video

                src="${item.src}"

                autoplay

                muted

                loop

                playsinline

                controls

            ></video>

        `;

    }


    /*
       IMAGE
    */

    else{

        html = `

            <img

                src="${item.src}"

                alt="Anayaluxee Jewelry"

            >

        `;

    }


    /*
       MAIN MEDIA HTML
    */

    container.innerHTML = `

        <button

            class="gallery-arrow prev"

            onclick="changeMedia(-1)"

        >

            <i
                class="fa-solid
                fa-chevron-left"
            ></i>

        </button>


        ${html}


        <button

            class="gallery-arrow next"

            onclick="changeMedia(1)"

        >

            <i
                class="fa-solid
                fa-chevron-right"
            ></i>

        </button>

    `;

}


/* ============================================================
   RENDER THUMBNAILS
   ============================================================ */

function renderThumbnails(){

    const container =
        document.getElementById(
            "thumbnails"
        );


    container.innerHTML =
        "";


    currentMedia.forEach(
        (item,index) => {


            const thumb =
                document.createElement(
                    "div"
                );


            thumb.className =
                "thumb" +
                (
                    index === currentIndex
                    ? " active"
                    : ""
                );


            /*
               VIDEO THUMB
            */

            if(
                item.type === "video"
            ){

                thumb.innerHTML = `

                    <video

                        src="${item.src}"

                        muted

                        preload="metadata"

                    ></video>

                `;

            }


            /*
               IMAGE THUMB
            */

            else{

                thumb.innerHTML = `

                    <img

                        src="${item.src}"

                        alt=""

                    >

                `;

            }


            /*
               THUMBNAIL CLICK
            */

            thumb.onclick =
                () => {

                    currentIndex =
                        index;


                    renderMainMedia();

                    renderThumbnails();

                };


            container.appendChild(
                thumb
            );

        }
    );

}


/* ============================================================
   CHANGE MEDIA
   ============================================================ */

function changeMedia(direction){

    if(!currentMedia.length){

        return;

    }


    currentIndex +=
        direction;


    /*
       LAST -> FIRST
    */

    if(
        currentIndex >=
        currentMedia.length
    ){

        currentIndex =
            0;

    }


    /*
       FIRST -> LAST
    */

    if(
        currentIndex < 0
    ){

        currentIndex =
            currentMedia.length - 1;

    }


    renderMainMedia();

    renderThumbnails();

}


/* ============================================================
   MOBILE MENU
   ============================================================ */

function toggleMenu(){

    document
        .getElementById(
            "navMenu"
        )
        .classList.toggle(
            "active"
        );

}


/* ============================================================
   CLOSE MOBILE MENU AFTER LINK CLICK
   ============================================================ */

document
    .querySelectorAll(
        "nav a"
    )
    .forEach(
        link => {

            link.addEventListener(
                "click",
                () => {

                    document
                        .getElementById(
                            "navMenu"
                        )
                        .classList.remove(
                            "active"
                        );

                }
            );

        }
    );


/* ============================================================
   CLOSE MODAL OUTSIDE
   ============================================================ */

document
    .getElementById(
        "productModal"
    )
    .addEventListener(
        "click",
        event => {

            if(
                event.target.id ===
                "productModal"
            ){

                closeModal();

            }

        }
    );


/* ============================================================
   KEYBOARD CONTROLS
   ============================================================ */

document.addEventListener(
    "keydown",
    event => {


        /*
           ESC
        */

        if(
            event.key === "Escape"
        ){

            closeModal();

        }


        /*
           RIGHT ARROW
        */

        if(
            event.key === "ArrowRight" &&
            document
                .getElementById(
                    "productModal"
                )
                .classList
                .contains(
                    "active"
                )
        ){

            changeMedia(1);

        }


        /*
           LEFT ARROW
        */

        if(
            event.key === "ArrowLeft" &&
            document
                .getElementById(
                    "productModal"
                )
                .classList
                .contains(
                    "active"
                )
        ){

            changeMedia(-1);

        }

    }
);


/* ============================================================
   START AUTOMATIC CATALOG
   ============================================================ */

loadProducts();

</script>
